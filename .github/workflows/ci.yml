name: CI

# Phase 1 gate: typecheck + lint + unit tests + build + boot smoke.
# The full Playwright suite (flows/visual/a11y) needs the emulator seed —
# it re-enables in Phase 2/3 as a separate job running against
# `firebase emulators:exec` with scripts/seed-emulator.ts.

# Runs on pull_request only. The push-to-main run used to duplicate it: merges
# here are SQUASH merges, so the tree that lands on main is the tree the PR run
# already tested, and re-running it cost 982 Actions minutes in Aug 2026 — a
# third of the monthly allowance — to re-confirm green results.
#
# What that trades away: if main moves between a PR's last run and its merge,
# the combination is not tested until the next PR. Restore the `push` trigger
# below (or adopt a merge queue) if that gap ever bites.
on:
  pull_request:
    branches: [main]
    # A docs-only PR cannot break a typecheck, a rules test or a browser suite,
    # and the emulator job is ~12 minutes. Five of the PRs merged on 19 Aug were
    # pure prose and each paid for the full matrix. paths-ignore skips only when
    # EVERY changed path matches, so a PR touching docs AND code still runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "notes/**"
      - "design/**"
  # Manual re-run for exactly the case above — validating main on demand.
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Without this they both
# run to completion and bill for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to bump the emulator tooling, and the key the JAR cache hangs off.
  FIREBASE_TOOLS_VERSION: "15.23.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Full-tree `npm run lint` carries pre-existing v1 app-code debt (newer
      # react-hooks plugin rules). CI gates NEW v2 code only; each Phase 5
      # module swap widens the scope until full-tree is green (MIGRATION_STATUS.md).
      - run: npm run lint:new
      - run: npx vitest run
      - run: npx vite build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # The browser SET is part of the key. Both jobs cache the same
          # directory, and they do not install the same browsers — a shared key
          # let this job's chromium-only cache satisfy the emulator job, which
          # then launched a webkit that was never downloaded.
          key: pw-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Boot smoke (no seed/emulators needed)
        run: npx playwright test e2e/smoke/boot.spec.ts --project=smoke

      # Report only on failure; continue-on-error so artifact-storage quota
      # problems can never fail a green run (lesson from v1).
      - name: Upload Playwright report
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  # Emulator-backed suites: security rules, the parse worker, and the seeded
  # end-to-end (auth + home so far, growing per migrated module). Needs Java (the
  # Firestore emulator) + firebase-tools + a browser for the e2e.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci --prefix firebase/functions

      # ── Caches. Everything below was re-downloaded on EVERY run. ──────────
      # firebase-tools is a large global install; the emulator JARs are tens of
      # MB fetched on first `emulators:exec`; Playwright's chromium is ~120MB
      # and was cached in the `checks` job but not here. Together they were
      # roughly 2.5 minutes of download per run, every run.
      - name: Resolve Playwright version
        id: vers
        run: echo "pw=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # chromium AND webkit — see the install step below. Distinct from the
          # `checks` key, which caches chromium alone.
          key: pw-${{ runner.os }}-chromium-webkit-${{ steps.vers.outputs.pw }}
      - uses: actions/cache@v4
        with:
          # Keyed on the firebase-tools version, because that is what decides
          # which emulator JARs get pulled.
          path: ~/.cache/firebase/emulators
          key: fb-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: fb-emulators-${{ runner.os }}-
      # PINNED. An unpinned global install meant CI silently changed its own
      # tooling version between runs, which is both a reproducibility problem
      # and an un-cacheable one. Matches the version the rules-emulator
      # behaviour in docs/launch-readiness.md was verified against.
      - run: npm i -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      # WEBKIT IS NOT OPTIONAL HERE. The a11y suite's mobile project uses
      # Playwright's `iPhone 14` preset, whose defaultBrowserType is webkit —
      # and that is the right engine to keep, not a detail to paper over: the
      # iOS app is a Capacitor WKWebView, so webkit IS the production surface
      # for half this suite. Pinning the project to chromium would have made CI
      # green by testing something the users never run.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Security-rules tests
        run: npm run test:rules:emu
      - name: Parse-worker integration tests
        run: npm run test:worker:emu

      # ONE emulator boot for all three browser suites. They used to be three
      # separate `emulators:exec` invocations, each paying a fresh JVM start.
      #
      #   e2e     — the seeded service-layer round trips
      #   a11y    — WCAG A/AA at both viewports, gating
      #   devices — layout at four viewports, gating; tap targets reported
      #
      # The seed is re-run BETWEEN suites, and that is load-bearing rather than
      # tidy: the e2e suite creates items and uploads photos, so without a
      # reseed the a11y suite scans a Home page containing rows the fixture
      # never produced. Combining them without this made a11y fail on a
      # contrast violation in exactly that extra state — a real finding, but not
      # one this suite is supposed to discover by accident. Reseeding is ~5s;
      # the JVM boot it replaces was ~35s.
      #
      # `&&` means the first failing suite still fails the job.
      - name: Browser suites (e2e + a11y + device matrix)
        run: npm run test:e2e:all:emu
      - name: Upload e2e report on failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emu-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
