name: CI

# Phase 1 gate: typecheck + lint + unit tests + build + boot smoke.
# The full Playwright suite (flows/visual/a11y) needs the emulator seed —
# it re-enables in Phase 2/3 as a separate job running against
# `firebase emulators:exec` with scripts/seed-emulator.ts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Full-tree `npm run lint` carries pre-existing v1 app-code debt (newer
      # react-hooks plugin rules). CI gates NEW v2 code only; each Phase 5
      # module swap widens the scope until full-tree is green (MIGRATION_STATUS.md).
      - run: npm run lint:new
      - run: npx vitest run
      - run: npx vite build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Boot smoke (no seed/emulators needed)
        run: npx playwright test e2e/smoke/boot.spec.ts --project=smoke

      # Report only on failure; continue-on-error so artifact-storage quota
      # problems can never fail a green run (lesson from v1).
      - name: Upload Playwright report
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  # Emulator-backed suites: security rules, the parse worker, and the seeded
  # end-to-end (auth + home so far, growing per migrated module). Needs Java (the
  # Firestore emulator) + firebase-tools + a browser for the e2e.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci --prefix firebase/functions
      - run: npm i -g firebase-tools
      - name: Security-rules tests
        run: npm run test:rules:emu
      - name: Parse-worker integration tests
        run: npm run test:worker:emu
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Seeded e2e (auth + home)
        run: npm run test:e2e:emu
      # Gates the merge. Runs at desktop AND mobile viewports: `target-size`
      # (tap targets) is only measurable at a touch viewport, and undersized tap
      # targets are what cost v1 five separate fix commits inside 48 hours.
      - name: Accessibility (WCAG A/AA, both viewports)
        run: npm run test:e2e:a11y:emu
      # Gates LAYOUT at four viewports. Tap targets below Apple's 44x44 are
      # reported into the log rather than gated — WCAG's 24x24 is what the a11y
      # step above enforces, and closing the gap to 44 is a design pass.
      - name: Device matrix (small phone → desktop)
        run: npm run test:e2e:devices:emu
      - name: Upload e2e report on failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emu-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
