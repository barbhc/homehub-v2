<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/homehub-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/homehub-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fonts: ONE request, and it does not block the first paint.
         There were three separate render-blocking stylesheets here, costing a
         measured 576ms of a 683ms load on a throttled phone — most of the cold
         start, spent before a single pixel could appear. Two of the four
         families were dead: DM Sans had no references at all, and DM Serif
         Display styled exactly one word on the boot splash, which now uses
         Georgia (already its fallback, and indistinguishable at 27px for the
         second it is on screen).
         The `media="print"` swap is the standard trick to make a stylesheet
         async: the browser fetches it at low priority and does not block
         rendering, then onload promotes it. With display=swap, text paints
         immediately in the system font and upgrades when Inter arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" />
    </noscript>

    <!-- Warm the connections the app makes the instant its JS runs. Each of
         these is a fresh origin needing DNS + TCP + TLS; on cellular that is
         300-600ms EACH, and today none of it starts until a megabyte of
         JavaScript has downloaded and parsed. Preconnecting overlaps that
         handshake with the bundle download instead of queueing behind it. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <title>homehub</title>
    <script>
      // Set theme class before paint to avoid a flash of the wrong appearance.
      (function(){try{var k='hh-appearance';var p=localStorage.getItem(k);if(p!=='light'&&p!=='dark'&&p!=='system')p='light';var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);}catch(e){}})();
    </script>
    <style>
      /* Instant boot splash — painted before the JS bundle parses and before
         web fonts load, so the ~3-5s cold start (iOS WebView launch + 1MB bundle
         parse + auth restore) shows the brand instead of a blank white screen.
         Uses only inline markup + system fonts so it needs zero network. React
         fades it out via hideBootSplash() once auth resolves (src/lib/bootSplash.ts);
         a safety timeout removes it even if that never fires. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: linear-gradient(155deg, #1B6B5A 0%, #2D9B82 100%);
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .bs-mark {
        width: 84px;
        height: 84px;
        animation: bs-breathe 1.7s ease-in-out infinite;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.18));
      }
      #boot-splash .bs-word {
        /* Georgia, not a webfont: the splash exists to cover the cold start,
           so it must never itself wait on a network request. */
        font-family: Georgia, "Times New Roman", serif;
        font-size: 27px;
        letter-spacing: 0.01em;
        color: #ffffff;
        opacity: 0.96;
      }
      @keyframes bs-breathe {
        0%, 100% { transform: scale(0.93); opacity: 0.82; }
        50%      { transform: scale(1);    opacity: 1;    }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg class="bs-mark" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M42 11 L71 35 V66 a5 5 0 0 1 -5 5 H18 a5 5 0 0 1 -5 -5 V35 Z" fill="#ffffff"/>
        <path d="M30 48 l8 8 l16 -17" stroke="#1B6B5A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="bs-word">Homehub</div>
    </div>
    <script>
      // Safety net: never trap the user on the splash if the app fails to signal
      // ready (offline auth hang, JS error). Force-remove after 9s.
      window.setTimeout(function () {
        var el = document.getElementById("boot-splash");
        if (el) { el.classList.add("boot-splash--hide"); window.setTimeout(function () { el.remove(); }, 500); }
      }, 9000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
