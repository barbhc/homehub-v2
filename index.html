<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/homehub-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/homehub-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fonts are self-hosted: bundled by Vite from @fontsource (imported in
         src/main.tsx, latin subset, font-display: swap), so there is no
         Google Fonts request, preconnect or async-stylesheet swap here any
         more. Text paints immediately in the system font and upgrades when the
         woff2 arrives from our own origin. -->

    <!-- Warm the connections the app makes the instant its JS runs. Each of
         these is a fresh origin needing DNS + TCP + TLS; on cellular that is
         300-600ms EACH, and today none of it starts until a megabyte of
         JavaScript has downloaded and parsed. Preconnecting overlaps that
         handshake with the bundle download instead of queueing behind it. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <title>homehub</title>
    <script>
      // Set theme class before paint to avoid a flash of the wrong appearance.
      (function(){try{var k='hh-appearance';var p=localStorage.getItem(k);if(p!=='light'&&p!=='dark'&&p!=='system')p='system';var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);}catch(e){}})();
    </script>
    <script>
      // Larger Text, before first paint: on iOS/iPadOS WebKit, measure the system Body size (17pt at the normal text size) and grow the root by measured / 17, clamped to [1, 3.2]; data-larger-text marks any scale above 1. Everywhere else, at the normal size, and if anything here throws, --type-scale stays 1. Re-measured on return from Settings (visibilitychange, pageshow) and, at most once a frame, on resize / orientationchange. See "Larger Text" in src/index.css.
      (function(){var r=document.documentElement,last='',q=0;function m(){q=0;var s=1,p=null;try{if(window.CSS&&CSS.supports('-webkit-touch-callout','none')&&CSS.supports('font','-apple-system-body')){p=document.createElement('span');p.style.cssText='font:-apple-system-body;position:absolute;visibility:hidden';r.appendChild(p);var b=parseFloat(getComputedStyle(p).fontSize);if(b>0)s=Math.min(3.2,Math.max(1,b/17));}}catch(e){s=1;}if(p&&p.parentNode)p.parentNode.removeChild(p);var n=Math.round(s*1000)/1000,v=String(n);if(v!==last){last=v;r.style.setProperty('--type-scale',v);r.toggleAttribute('data-larger-text',n>1);}}function later(){if(!q)q=requestAnimationFrame(m);}m();document.addEventListener('visibilitychange',function(){if(!document.hidden)m();});window.addEventListener('pageshow',m);window.addEventListener('orientationchange',later);window.addEventListener('resize',later);})();
    </script>
    <style>
      /* Boot splash — painted with the very first frame, before the JS bundle
         parses, and faded out by hideBootSplash() once auth resolves
         (src/lib/bootSplash.ts); the inline timeout below removes it if that
         never happens.

         It is the PAGE COLOUR and nothing else (Apple-polish phase 3, HIG
         "Launching"): the launch screen should look like the first screen, so
         no logo, no wordmark, no animation. The iOS shell paints the same two
         colours natively — its launch screen and the WebView behind this page
         use the AppBackground colour asset in barbhc/homehub — so the cold
         start is one surface from tap to content, in light and in dark.

         Light/dark comes from the `dark` class the pre-paint script above has
         already set, so the in-app Appearance choice is honoured here too. The
         colours are --hh-bg (src/index.css); the literals are the fallback for
         the instant before the stylesheet applies, and src/test/bootSplash.test.ts pins
         them to the tokens. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: var(--hh-bg, #F3F5F4);
        opacity: 1;
        transition: opacity 0.2s ease-out;
      }
      html.dark #boot-splash {
        background: var(--hh-bg, #0D1411);
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"></div>
    <script>
      // Safety net: never trap the user on the splash if the app fails to signal
      // ready (offline auth hang, JS error). Force-remove after 9s.
      window.setTimeout(function () {
        var el = document.getElementById("boot-splash");
        if (el) { el.classList.add("boot-splash--hide"); window.setTimeout(function () { el.remove(); }, 500); }
      }, 9000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
